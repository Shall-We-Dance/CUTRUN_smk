$schema: "https://json-schema.org/draft/2020-12/schema"
type: object
additionalProperties: true
required:
  - read_type
  - threads
  - reference
  - samples
  - output
properties:
  genome:
    type: string
  assay_type:
    type: string
    enum: ["cutrun", "chipseq"]
  analysis_mode:
    type: string
    enum: ["standard", "te"]
  read_type:
    type: string
    enum: ["PE", "SE"]
  samtools_sort_memory:
    type: string
    pattern: "^[0-9]+([KMGTP]i?B?|[kmg])$"
  picard_java_mem:
    type: string
  te:
    type: object
    additionalProperties: true
    required:
      - annotation
    properties:
      annotation:
        type: string
      k:
        type: integer
        minimum: 1
      exclude_flags:
        type: integer
        minimum: 0
      remove_duplicates:
        type: boolean
      blacklist:
        type: string
        enum: ["none", "full"]
      generate_bigwig:
        type: boolean
      bin_size:
        type: integer
        minimum: 1
      normalization:
        type: string
      class_column:
        type: integer
        minimum: 1
      subfamily_column:
        type: integer
        minimum: 1
      family_column:
        type: integer
        minimum: 1
      min_overlap_frac:
        type: number
        minimum: 0
        maximum: 1
      min_overlap_bp:
        type: integer
        minimum: 1
      dfam_metadata:
        type: string
        description: >-
          TSV (accession, name, ...) mapping TE family names to Dfam
          accessions, used to classify curated vs novel vs unknown families.
  threads:
    type: object
    additionalProperties:
      type: integer
      minimum: 1
    required:
      - fastp
      - bowtie2
      - samtools
      - deeptools
    properties:
      fastp:
        type: integer
        minimum: 1
      bowtie2:
        type: integer
        minimum: 1
      samtools:
        type: integer
        minimum: 1
      deeptools:
        type: integer
        minimum: 1
      dedup:
        type: integer
        minimum: 1
  reference:
    type: object
    additionalProperties: true
    required:
      - bowtie2_index
      - chrom_sizes
      - fasta
    properties:
      bowtie2_index:
        type: string
        minLength: 1
      chrom_sizes:
        type: string
        minLength: 1
      fasta:
        type: string
        minLength: 1
  filter_blacklist:
    type: boolean
  blacklist:
    type: object
    additionalProperties: true
    properties:
      path:
        type: string
      url:
        type: string
      cache_dir:
        type: string
  remove_duplicates:
    type: boolean
  dedup_method:
    type: string
    enum: ["picard", "samtools"]
  keep_bam:
    type: boolean
  samtools_exclude_flags:
    type: integer
    minimum: 0
  consensus:
    $ref: "#/$defs/consensus"
  idr:
    $ref: "#/$defs/idr"
  fragments:
    type: object
    additionalProperties: false
    properties:
      exclude_flags:
        type: integer
        minimum: 0
      remove_chrM_and_scaffolds:
        type: boolean
      se_extension:
        type: integer
        minimum: 1
  bedtools_nonamecheck:
    type: boolean
  samples:
    type: object
    minProperties: 1
    additionalProperties:
      type: object
      additionalProperties: true
      required:
        - replicates
      properties:
        _implicit_single_replicate:
          type: boolean
        replicates:
          type: object
          minProperties: 1
          additionalProperties:
            type: object
            additionalProperties: true
            required:
              - R1
            properties:
              R1:
                type: array
                minItems: 1
                items:
                  type: string
                  minLength: 1
              R2:
                type: array
                minItems: 1
                items:
                  type: string
                  minLength: 1
        control:
          type: string
        control_replicate:
          type: [string, "null"]
          description: >-
            Optional explicit replicate mapping of the matched input/control
            (e.g. "rep1"). When omitted, the same replicate name as the ChIP
            replicate is assumed. Set to "pooled" to use the pooled control
            for every ChIP replicate.
        control_replicates:
          type: object
          additionalProperties:
            type: string
          description: >-
            Preferred explicit mapping from each ChIP replicate name to a
            control replicate name (or "pooled"). This is validated before
            DAG construction and is used by both MACS3 and TE enrichment.
        call_peaks:
          type: boolean
        consensus:
          $ref: "#/$defs/consensus"
        idr:
          $ref: "#/$defs/idr"
        macs3:
          type: object
          additionalProperties: true
          properties:
            gsize:
              type: [string, number]
            qvalue:
              type: number
              minimum: 0
              maximum: 1
            extsize:
              type: integer
              minimum: 1
            keep_dup:
              anyOf:
                - type: string
                  enum: ["all", "auto"]
                - type: integer
                  minimum: 1
            broad:
              type: boolean
            broad_cutoff:
              type: number
              minimum: 0
              maximum: 1
            nomodel:
              type: boolean
  fastp:
    type: object
    additionalProperties: true
    properties:
      dedup_adapter:
        type: object
        additionalProperties: true
        properties:
          enable:
            type: boolean
          dedup:
            type: boolean
          extra:
            type: string
  bowtie2:
    type: object
    additionalProperties: true
    properties:
      max_insert_size:
        type: integer
        minimum: 1
      min_insert_size:
        type: integer
        minimum: 0
      mode:
        type: string
      keep_multimappers:
        type: boolean
      k:
        type: integer
        minimum: 1
      mapq_threshold:
        type: integer
        minimum: 0
      extra:
        type: string
  output:
    type: object
    additionalProperties: true
    required:
      - dir
    properties:
      dir:
        type: string
        minLength: 1
  generate_multiqc:
    type: boolean
  macs3:
    type: object
    additionalProperties: true
    properties:
      enabled:
        type: boolean
      gsize:
        type: [string, number]
      qvalue:
        type: number
        minimum: 0
        maximum: 1
      extsize:
        type: integer
        minimum: 1
      keep_dup:
        anyOf:
          - type: string
            enum: ["all", "auto"]
          - type: integer
            minimum: 1
      broad:
        type: boolean
      broad_cutoff:
        type: number
        minimum: 0
        maximum: 1
      nomodel:
        type: boolean
  bigwig:
    type: object
    additionalProperties: true
    properties:
      bin_size:
        type: integer
        minimum: 1
      normalization:
        type: string
        enum: ["RPKM", "CPM", "BPM", "RPGC", "None"]
      samtools_exclude_flags:
        type: integer
        minimum: 0
      remove_chrM_and_scaffolds:
        type: boolean
  generate_raw_bigwig:
    type: boolean
  generate_normalized_bigwig:
    type: boolean
  cutrun_qc:
    type: object
    additionalProperties: true
    properties:
      enabled:
        type: boolean
  spikein:
    type: object
    additionalProperties: true
    properties:
      enabled:
        type: boolean
      bowtie2_index:
        type: string
      scale_to:
        type: number
        exclusiveMinimum: 0
      min_fragments:
        type: integer
        minimum: 0
      generate_bigwig:
        type: boolean

$defs:
  consensus:
    type: object
    additionalProperties: false
    properties:
      min_replicates:
        anyOf:
          - type: string
            enum: ["majority", "all"]
          - type: integer
            minimum: 2
      narrow:
        type: object
        additionalProperties: false
        properties:
          match:
            type: string
            enum: ["reciprocal_overlap", "summit_distance"]
          min_overlap_fraction:
            type: number
            exclusiveMinimum: 0
            maximum: 1
          summit_distance:
            type: integer
            minimum: 0
      broad:
        type: object
        additionalProperties: false
        properties:
          min_coverage_fraction:
            type: number
            exclusiveMinimum: 0
            maximum: 1
          min_core_length:
            type: integer
            minimum: 1
  idr:
    type: object
    additionalProperties: false
    properties:
      enabled:
        type: boolean
      threshold:
        type: number
        exclusiveMinimum: 0
        exclusiveMaximum: 1
      relaxed_pvalue:
        type: number
        exclusiveMinimum: 0
        exclusiveMaximum: 1
      rank:
        type: string
        enum: ["p.value", "signal.value"]
      min_peaks:
        type: integer
        minimum: 20
