# workflow/config.yaml
# CUT&RUN / CUT&Tag / ChIP-seq configuration

genome: example_genome  # Genome label used in reports and logs.
# Assay type is optional and defaults to "cutrun" when omitted.
# Use "chipseq" for ChIP-seq. Input/control and explicit replicate labels then
# become available through the expanded sample form below, but remain optional.
assay_type: cutrun


# Analysis mode:
#   standard = unique-mapper analysis (recommended default)
#   te       = additionally retain multimappers and quantify TE families
analysis_mode: standard

# Read type: PE (paired-end) or SE (single-end).
# For SE data, omit every R2 entry under samples.
read_type: "PE"

# Rule-level CPU requests. Snakemake reduces them when --cores is lower.
threads:
  fastp: 8
  bowtie2: 16
  samtools: 8
  deeptools: 8
  dedup: 4

# samtools sort memory is per worker, not total memory for the job.
samtools_sort_memory: "512M"
picard_java_mem: "4g"

# Reference and Bowtie2 index.
reference:
  # Prefix shared by genome.1.bt2, genome.2.bt2, etc. Do not include .1.bt2.
  bowtie2_index: "resources/reference/genome"
  # Two-column TSV: chromosome<TAB>length.
  chrom_sizes: "resources/reference/genome.chrom.sizes"
  # Uncompressed FASTA. The workflow creates the .fai index when necessary.
  fasta: "resources/reference/genome.fa"

# Enable blacklist filtering for the standard/unique-mapper branch.
filter_blacklist: true

# Blacklist input. Provide either path or url.
blacklist:
  path: "resources/blacklist/genome.blacklist.bed"
  # url: "https://example.org/genome.blacklist.bed.gz"
  # e.g.  "https://raw.githubusercontent.com/Boyle-Lab/Blacklist/master/lists/dm6-blacklist.v2.bed.gz"
  cache_dir: "resources/blacklist"

# Remove PCR duplicates from the standard/unique-mapper branch.
remove_duplicates: true
dedup_method: "picard"  # Options: picard, samtools.

# Keep final per-replicate BAM/BAI outputs.
keep_bam: true

# Exclude unmapped, mate-unmapped, secondary, QC-fail, and alignments already
# flagged as duplicates. Newly detected duplicates are handled downstream.
samtools_exclude_flags: 1804

# Allow chromosome naming-style differences in bedtools.
bedtools_nonamecheck: true

# Example 1 (active): routine CUT&RUN, one biological sample, no Input required.
# Put R1/R2 directly under its name; no replicate label or control/input is required.
#
# R1 and R2 are lists and CAN contain multiple sequencing lanes. Corresponding
# R1/R2 lists must have the same length and lane order. Lanes are concatenated
# within a biological replicate before sample-level QC/alignment.
#
# For several biological replicates, use the advanced `replicates:` layout
# documented in README.md. Pooled outputs are generated only when a sample has
# at least two explicit biological replicates. Sample and explicit replicate
# names cannot contain a period.
samples:
  Example_H3K4me3:
    R1:
      - "raw/example_H3K4me3_L001_R1.fastq.gz"
      - "raw/example_H3K4me3_L002_R1.fastq.gz"
    R2:
      - "raw/example_H3K4me3_L001_R2.fastq.gz"
      - "raw/example_H3K4me3_L002_R2.fastq.gz"
    macs3:
      broad: false

# Example 2 (commented): ChIP-seq with optional biological replicates and Input.
# To use it, set assay_type: chipseq above, remove/comment Example 1's samples
# block, and uncomment this block. The control block may be omitted when no
# matched Input is available. Every PE replicate may also contain multiple lanes.
# samples:
#   Example_TF_ChIP:
#     control: Example_INPUT
#     replicates:
#       rep1:
#         R1:
#           - "raw/example_TF_ChIP_rep1_L001_R1.fastq.gz"
#           - "raw/example_TF_ChIP_rep1_L002_R1.fastq.gz"
#         R2:
#           - "raw/example_TF_ChIP_rep1_L001_R2.fastq.gz"
#           - "raw/example_TF_ChIP_rep1_L002_R2.fastq.gz"
#       rep2:
#         R1: ["raw/example_TF_ChIP_rep2_R1.fastq.gz"]
#         R2: ["raw/example_TF_ChIP_rep2_R2.fastq.gz"]
#     control_replicates:
#       rep1: input_rep1
#       rep2: input_rep2
#     macs3:
#       broad: false
#   Example_INPUT:
#     call_peaks: false
#     replicates:
#       input_rep1:
#         R1: ["raw/example_INPUT_rep1_R1.fastq.gz"]
#         R2: ["raw/example_INPUT_rep1_R2.fastq.gz"]
#       input_rep2:
#         R1: ["raw/example_INPUT_rep2_R1.fastq.gz"]
#         R2: ["raw/example_INPUT_rep2_R2.fastq.gz"]

# fastp settings.
fastp:
  dedup_adapter:
    enable: true   # Adapter trimming on/off; QC reports are still generated.
    dedup: false   # FASTQ-level deduplication is disabled by default.
    extra: ""      # Optional additional fastp arguments.

# Bowtie2 alignment settings.
bowtie2:
  min_insert_size: 10
  max_insert_size: 500
  mode: "very-sensitive"  # very-fast, fast, sensitive, or very-sensitive.
  keep_multimappers: false # Standard-mode setting; TE mode retains them.
  k: 1                     # Standard-mode multimapper limit, if enabled.
  mapq_threshold: 30
  extra: ""

# Output directory. Use a different directory for each parameter-sensitivity
# run; logs are stored inside this directory as <output.dir>/logs/.
output:
  dir: "results"

# Generate summary reports.
generate_multiqc: true

# CUT&RUN/CUT&Tag-specific QC.
# For conventional ChIP-seq, set enabled: false unless these fragment metrics are desired.
cutrun_qc:
  enabled: true

# Optional spike-in normalization.
spikein:
  enabled: false
  bowtie2_index: "resources/spikein/spikein_genome"
  scale_to: 10000
  min_fragments: 1000
  generate_bigwig: true

# MACS3 peak calling.
macs3:
  enabled: true
  gsize: "1.2e8"       # Effective genome size or MACS3 shortcut (hs/mm/ce/dm).
  qvalue: 0.05
  extsize: 200
  # The upstream BAM is deduplicated when remove_duplicates=true. Using all
  # avoids applying a second coordinate-level duplicate cutoff in MACS3.
  keep_dup: "all"      # all, auto, or a positive integer.
  # false: narrowPeak + summits.bed; true: broadPeak + gappedPeak (no summits,
  # because MACS3 forbids combining --broad with --call-summits).
  broad: false
  broad_cutoff: 0.1
  nomodel: true

# BigWig generation.
bigwig:
  bin_size: 10
  normalization: "RPKM"  # RPKM, CPM, BPM, RPGC, or None.
  samtools_exclude_flags: 1804
  remove_chrM_and_scaffolds: true

generate_raw_bigwig: true
generate_normalized_bigwig: true

# ----------------------------------------------------------------------------
# TE-aware analysis settings
# ----------------------------------------------------------------------------
# This section is used only when analysis_mode: te. TE mode keeps the standard
# unique-mapper branch and adds a separate all-alignment branch for TE analysis.
te:
  # BED6+ TE annotation. Column numbers below are 1-based.
  annotation: "resources/te/genome.te.bed"
  family_column: 9
  subfamily_column: 8
  class_column: 7

  # Number of alignments reported per template. Larger values increase BAM
  # size/runtime; compare several k values before publication-level inference.
  k: 100

  # Exclude unmapped (4) and QC-fail (512), while retaining secondary (256)
  # alignments so multimappers contribute to 1/N weighting.
  exclude_flags: 516

  # Recommended primary TE analysis retains duplicates. Coordinate duplicate
  # removal can erase genuine enrichment in repetitive regions. Test true as a
  # separate sensitivity analysis when appropriate.
  remove_duplicates: false

  # none = do not blacklist the TE branch; full = apply the complete blacklist.
  # The standard unique-mapper branch still follows filter_blacklist above.
  blacklist: "none"

  min_overlap_bp: 1
  min_overlap_frac: 0.0

  # Diagnostic alignment-count track; not a family abundance track.
  generate_bigwig: true
  bin_size: 10
  normalization: "RPKM"

  # Optional but recommended TSV: Dfam accession<TAB>family name<...>.
  # Verified names are curated; unmatched names remain unknown. Comment this
  # setting out if no metadata table is available.
  dfam_metadata: "resources/te/dfam_metadata.tsv"
