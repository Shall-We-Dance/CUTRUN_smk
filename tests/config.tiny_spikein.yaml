# Test-only: reuse the tiny target index as spike-in to exercise counting and MultiQC.
# This is a software fixture, not a biological spike-in calibration.
genome: tiny
analysis_mode: standard
read_type: PE
threads:
  fastp: 2
  bowtie2: 4
  samtools: 2
  deeptools: 2
  dedup: 2
reference:
  bowtie2_index: tests/data/tiny_ref
  chrom_sizes: tests/data/tiny.chrom.sizes
  fasta: tests/data/tiny_ref.fa
filter_blacklist: true
blacklist:
  cache_dir: tests/data
  path: tests/data/tiny_blacklist.bed
remove_duplicates: true
dedup_method: picard
keep_bam: true
samtools_exclude_flags: 1804
bedtools_nonamecheck: true
samples:
  Tiny_ChIP:
    R1: [tests/data/tiny_R1.fastq.gz, tests/data/tiny_L002_R1.fastq.gz]
    R2: [tests/data/tiny_R2.fastq.gz, tests/data/tiny_L002_R2.fastq.gz]
fastp:
  dedup_adapter:
    enable: true
    dedup: false
    extra: ""
bowtie2:
  max_insert_size: 500
  mode: very-sensitive
  keep_multimappers: false
  k: 100
  mapq_threshold: 20
  extra: ""
output:
  dir: tests/out_tiny_spikein
generate_multiqc: true
cutrun_qc:
  enabled: true
spikein:
  enabled: true
  bowtie2_index: tests/data/tiny_ref
  scale_to: 10000
  min_fragments: 20
  generate_bigwig: true
macs3:
  enabled: true
  gsize: 10000
  qvalue: 0.05
  extsize: 100
  keep_dup: all
  broad: false
  broad_cutoff: 0.1
bigwig:
  bin_size: 5
  normalization: RPKM
  samtools_exclude_flags: 1804
  remove_chrM_and_scaffolds: false
generate_raw_bigwig: true
generate_normalized_bigwig: true
# Deliberately nonexistent: standard mode must ignore TE-only resources.
te:
  annotation: tests/data/not_available_in_standard_mode.bed
  dfam_metadata: tests/data/not_available_in_standard_mode.tsv
